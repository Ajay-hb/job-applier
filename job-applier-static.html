<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Applier – Static Demo</title>
<style>
/* ------------------------------------------------------------
   Embedded CSS – same as web/static/css/style.css
   ------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0d1117;
  --bg2:       #161b22;
  --bg3:       #1c2128;
  --border:    #30363d;
  --accent:    #2563eb;
  --accent2:   #7c3aed;
  --green:     #22c55e;
  --red:       #ef4444;
  --yellow:    #f59e0b;
  --blue:      #3b82f6;
  --text:      #e6edf3;
  --muted:     #8b949e;
  --radius:    12px;
  --sidebar-w: 230px;
}
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; font-size: 14px; }
/* Sidebar */
.sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100; transition: transform 0.25s; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
.brand-icon { font-size: 1.6rem; }
.brand-name { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-section { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 16px 20px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; color: var(--muted); cursor: pointer; border-radius: 0; transition: all 0.15s; text-decoration: none; font-size: 13.5px; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(37,99,235,0.15); color: var(--blue); border-right: 2px solid var(--blue); }
.nav-icon { font-size: 1rem; width: 20px; text-align: center; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.bot-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.status-dot.idle { background: var(--muted); }
.status-dot.running { background: var(--green); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(1.3);} }
/* Main */
.main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
.menu-toggle { display: none; background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; }
.topbar-title { font-size: 1rem; font-weight: 600; flex: 1; }
.bot-pill { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; font-size: 12px; color: var(--muted); }
.bot-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.bot-pill .dot.running { background: var(--green); animation: pulse 1.2s infinite; }
.page-content { padding: 28px; flex: 1; max-width: 1100px; width: 100%; }
/* Cards */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 20px; color: var(--text); }
/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
.stat-card .s-num { font-size: 2.4rem; font-weight: 800; line-height:1; }
.stat-card .s-label { font-size: 11px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card.blue .s-num { color: var(--blue); }
.stat-card.green .s-num { color: var(--green); }
.stat-card.red .s-num { color: var(--red); }
.stat-card.yellow .s-num { color: var(--yellow); }
/* Tables */
.table-wrap { overflow-x:auto; border-radius: var(--radius); }
table { width:100%; border-collapse:collapse; }
thead th { background: var(--bg3); padding:10px 14px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color: var(--muted); font-weight:600; white-space:nowrap; }
tbody td { padding:11px 14px; border-bottom:1px solid var(--border); font-size:13px; }
tbody tr:last-child td { border-bottom:none; }
.badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; }
.badge-applied{background:rgba(59,130,246,0.15);color:#60a5fa;}
.badge-interview{background:rgba(34,197,94,0.15);color:#4ade80;}
.badge-rejected{background:rgba(239,68,68,0.15);color:#f87171;}
.badge-offer{background:rgba(245,158,11,0.15);color:#fbbf24;}
.badge-platform{background:var(--bg3);color:var(--muted);border:1px solid var(--border);}
/* Responsive */
@media (max-width:768px){ .sidebar{transform:translateX(-100%);} .sidebar.open{transform:translateX(0);} .main{margin-left:0;} .menu-toggle{display:block;} .form-grid{grid-template-columns:1fr;} .stats-grid{grid-template-columns:1fr 1fr;} .page-content{padding:16px;} }
</style>
</head>
<body>
<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">🤖</span>
    <span class="brand-name">JobBot</span>
  </div>
  <nav class="sidebar-nav">
    <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard',this)"><span class="nav-icon">📊</span>Dashboard</a>
    <a class="nav-item" data-page="run" onclick="navigate('run',this)"><span class="nav-icon">▶️</span>Run Bot</a>
    <a class="nav-item" data-page="applications" onclick="navigate('applications',this)"><span class="nav-icon">📋</span>Applications</a>
    <div class="nav-section">Settings</div>
    <a class="nav-item" data-page="profile" onclick="navigate('profile',this)"><span class="nav-icon">👤</span>My Profile</a>
    <a class="nav-item" data-page="search" onclick="navigate('search',this)"><span class="nav-icon">🔍</span>Job Search</a>
    <a class="nav-item" data-page="platforms" onclick="navigate('platforms',this)"><span class="nav-icon">🌐</span>Platforms</a>
    <a class="nav-item" data-page="resume" onclick="navigate('resume',this)"><span class="nav-icon">📄</span>Resume</a>
    <a class="nav-item" data-page="logs" onclick="navigate('logs',this)"><span class="nav-icon">📝</span>Logs</a>
  </nav>
  <div class="sidebar-footer">
    <div class="bot-status" id="bot-status-indicator"><span class="status-dot idle"></span><span class="status-text">Bot Idle</span></div>
  </div>
</aside>

<!-- Main Content -->
<main class="main">
  <div class="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title" id="page-title">Dashboard</div>
    <div class="topbar-actions"><div class="bot-pill" id="top-bot-pill"><span class="dot idle" id="top-dot"></span><span id="top-status-text">Idle</span></div></div>
  </div>
  <div class="page-content" id="page-content"></div>
</main>

<script>
/* ------------------------------------------------------------
   Embedded JS – static mock version (no backend)
   ------------------------------------------------------------ */
let currentPage = "dashboard";
let mockData = {
  stats: {
    total: 12,
    interviews: 3,
    rejected: 5,
    offers: 1,
    by_platform: {linkedin:5, naukri:4, indeed:2, glassdoor:1}
  },
  applications: [
    {id:1, job_title:"Backend Engineer", company:"Acme Corp", platform:"linkedin", status:"applied", date_applied:"2026-11-15", job_url:"#"},
    {id:2, job_title:"Data Scientist", company:"Beta Ltd", platform:"naukri", status:"interview", date_applied:"2026-11-14", job_url:"#"},
    {id:3, job_title:"Full‑Stack Dev", company:"Gamma Inc", platform:"indeed", status:"rejected", date_applied:"2026-11-13", job_url:"#"},
    {id:4, job_title:"DevOps Engineer", company:"Delta LLC", platform:"glassdoor", status:"offer", date_applied:"2026-11-12", job_url:"#"}
  ]
};

window.onload = () => { navigate('dashboard', document.querySelector('[data-page="dashboard"]')); };

function navigate(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('page-title').textContent = page.charAt(0).toUpperCase()+page.slice(1);
  const container = document.getElementById('page-content');
  container.innerHTML = '';
  const pages = {dashboard:renderDashboard, run:renderRun, applications:renderApplications, profile:renderProfile, search:renderSearch, platforms:renderPlatforms, resume:renderResume, logs:renderLogs};
  if (pages[page]) pages[page](container);
}

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

function renderDashboard(container){
  container.innerHTML = `
    <div class="stats-grid" id="stat-cards">
      <div class="stat-card blue"><div class="s-num">${mockData.stats.total}</div><div class="s-label">Total Applied</div></div>
      <div class="stat-card green"><div class="s-num">${mockData.stats.interviews}</div><div class="s-label">Interviews</div></div>
      <div class="stat-card red"><div class="s-num">${mockData.stats.rejected}</div><div class="s-label">Rejected</div></div>
      <div class="stat-card yellow"><div class="s-num">${mockData.stats.offers}</div><div class="s-label">Offers 🎉</div></div>
    </div>
    <div class="card">
      <div class="card-title"><span>📋</span>Recent Applications</div>
      <div class="table-wrap"><table><thead><tr><th>Role</th><th>Company</th><th>Platform</th><th>Status</th><th>Date</th></tr></thead><tbody id="recent-tbody"></tbody></table></div>
    </div>
    <div class="card">
      <div class="card-title"><span>📈</span>Applications by Platform</div>
      <div id="platform-breakdown" style="display:flex;gap:24px;flex-wrap:wrap;padding:4px 0"></div>
    </div>`;
  const tbody = document.getElementById('recent-tbody');
  const recent = mockData.applications.slice(0,5);
  tbody.innerHTML = recent.map(a=>`<tr><td><a class="job-link" href="${a.job_url}">${a.job_title}</a></td><td>${a.company}</td><td><span class="badge badge-platform">${a.platform}</span></td><td><span class="badge badge-${a.status}">${a.status}</span></td><td class="text-muted" style="font-size:12px">${a.date_applied}</td></tr>`).join('');
  const pb = document.getElementById('platform-breakdown');
  pb.innerHTML = Object.entries(mockData.stats.by_platform).map(([pl,c])=>`<div style="text-align:center"><div style="font-size:1.8rem;font-weight:800;color:var(--blue)">${c}</div><div style="font-size:11px;color:var(--muted);text-transform:capitalize">${pl}</div></div>`).join('');
}

function renderRun(container){
  container.innerHTML = `
    <div class="card run-hero"><div class="hero-icon">🤖</div><h2>Auto Job Applier</h2><p>The bot will (in the real app) search, fill and submit applications automatically.</p><div class="run-controls"><button class="btn btn-green btn-lg" id="start-btn" onclick="startBot()">▶ Start Bot</button><button class="btn btn-red btn-lg" id="stop-btn" onclick="stopBot()" disabled>⏹ Stop</button></div></div>
    <div class="card"><div class="card-title"><span>📊</span>Session Progress</div><div style="display:flex;gap:32px;margin-bottom:16px;flex-wrap:wrap"><div><div style="font-size:1.6rem;font-weight:800;color:var(--blue)" id="run-applied">0</div><div class="text-muted" style="font-size:11px">Applied</div></div><div><div style="font-size:1.6rem;font-weight:800;color:var(--muted)" id="run-found">0</div><div class="text-muted" style="font-size:11px">Jobs Found</div></div><div style="flex:1;min-width:200px;display:flex;flex-direction:column;justify-content:center"><div class="text-muted" style="font-size:11px;margin-bottom:4px" id="run-current-job">Idle</div><div class="progress-bar-wrap"><div class="progress-bar" id="run-progress" style="width:0%"></div></div></div></div></div>
    <div class="card"><div class="card-title" style="display:flex;justify-content:space-between"><span>📝</span>Live Log</span><button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="clearLog()">Clear</button></div><div class="log-box" id="run-log">(static demo – no live log)</div></div>`;
}

function startBot(){
  document.getElementById('start-btn').disabled=true;
  document.getElementById('stop-btn').disabled=false;
  document.getElementById('top-status-text').textContent='Running';
  document.getElementById('top-dot').classList.add('running');
  // mock progress
  let applied=0, found=5;
  document.getElementById('run-found').textContent=found;
  const interval=setInterval(()=>{
    if(applied>=found){clearInterval(interval); document.getElementById('stop-btn').click(); return;}
    applied++; document.getElementById('run-applied').textContent=applied; document.getElementById('run-current-job').textContent='Applying...';
    document.getElementById('run-progress').style.width=(applied/found*100)+'%';
  },800);
}
function stopBot(){
  document.getElementById('start-btn').disabled=false;
  document.getElementById('stop-btn').disabled=true;
  document.getElementById('top-status-text').textContent='Idle';
  document.getElementById('top-dot').classList.remove('running');
  document.getElementById('run-current-job').textContent='Idle';
}
function clearLog(){ document.getElementById('run-log').innerHTML=''; }

function renderApplications(container){
  container.innerHTML = `
    <div class="section-header"><h2>All Applications</h2><input id="app-search" placeholder="Search..." style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);outline:none;font-family:inherit;font-size:13px;width:200px" oninput="filterTable()"></div>
    <div class="filter-bar" id="app-filters"><button class="filter-btn active" onclick="setAppFilter('all',this)">All</button><button class="filter-btn" onclick="setAppFilter('applied',this)">Applied</button><button class="filter-btn" onclick="setAppFilter('interview',this)">Interview</button><button class="filter-btn" onclick="setAppFilter('rejected',this)">Rejected</button><button class="filter-btn" onclick="setAppFilter('offer',this)">Offer</button></div>
    <div class="card" style="padding:0;overflow:hidden"><div class="table-wrap"><table><thead><tr><th>#</th><th>Role</th><th>Company</th><th>Location</th><th>Platform</th><th>Status</th><th>Date</th></tr></thead><tbody id="apps-tbody"></tbody></table></div></div>`;
  window._allApps = mockData.applications;
  window._appFilter='all';
  renderAppTable(window._allApps);
}
function renderAppTable(apps){
  const tbody=document.getElementById('apps-tbody');
  if(!apps.length){ tbody.innerHTML='<tr><td colspan="7" class="empty-state"><div class="e-icon">📭</div><p>No applications found.</p></td></tr>'; return; }
  tbody.innerHTML=apps.map((a,i)=>`<tr><td class="text-muted" style="font-size:12px">${i+1}</td><td><a class="job-link" href="${a.job_url}">${a.job_title}</a></td><td>${a.company}</td><td class="text-muted" style="font-size:12px">—</td><td><span class="badge badge-platform">${a.platform}</span></td><td><span class="badge badge-${a.status}">${a.status}</span></td><td class="text-muted" style="font-size:12px">${a.date_applied}</td></tr>`).join('');
}
function setAppFilter(status,btn){ document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); window._appFilter=status; filterTable(); }
function filterTable(){ const q=(document.getElementById('app-search')?.value||'').toLowerCase(); const f=window._appFilter; let apps=window._allApps||[]; if(f!=='all') apps=apps.filter(a=>a.status===f); if(q) apps=apps.filter(a=>a.job_title.toLowerCase().includes(q)||a.company.toLowerCase().includes(q)||a.platform.toLowerCase().includes(q)); renderAppTable(apps); }

function renderProfile(container){ container.innerHTML='<div class="card"><div class="card-title"><span>👤</span>Profile (static demo)</div><p>Profile editing not available in static demo.</p></div>'; }
function renderSearch(container){ container.innerHTML='<div class="card"><div class="card-title"><span>🔍</span>Job Search (static demo)</div><p>Search config editing not available in static demo.</p></div>'; }
function renderPlatforms(container){ container.innerHTML='<div class="card"><div class="card-title"><span>🌐</span>Platforms (static demo)</div><p>Platform settings not available in static demo.</p></div>'; }
function renderResume(container){ container.innerHTML='<div class="card"><div class="card-title"><span>📄</span>Resume (static demo)</div><p>Upload not available – this is a static page.</p></div>'; }
function renderLogs(container){ container.innerHTML='<div class="card"><div class="card-title"><span>📝</span>Logs (static demo)</div><p>No logs – static demo.</p></div>'; }
</script>
</body>
</html>
